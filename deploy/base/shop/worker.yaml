apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: shop
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: orders
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: worker
          image: orders-app
          command: ["python", "-m", "orders.worker"]
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          resources:
            requests:
              cpu: "100"
              memory: 192Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true