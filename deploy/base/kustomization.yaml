apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace'ы shop и data создаются один раз админом (cluster/bootstrap.yaml),
# у CI-аккаунта нет прав на cluster-scoped ресурсы.
resources:
  - data/redis.yaml
  - data/networkpolicy.yaml
  - shop/config.yaml
  - shop/api.yaml
  - shop/worker.yaml