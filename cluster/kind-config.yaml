# Учебный кластер: 1 control-plane + 3 worker-ноды на одном сервере.
#   kind create cluster --name lab --config cluster/kind-config.yaml
#
# Если GitHub Actions будет ходить в API снаружи (а не через self-hosted runner
# на этом же сервере), замени 203.0.113.10 на публичный IP/DNS сервера и
# ограничь доступ к порту 6443 файрволом.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "127.0.0.1"
        - "localhost"
        - "203.0.113.10"
nodes:
  - role: control-plane
  - role: worker
    labels:
      zone: lab-a
  - role: worker
    labels:
      zone: lab-b
  - role: worker
    labels:
      zone: lab-b
      disk: ssd
